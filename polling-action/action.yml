name: awscurl-polling-action
description: CI Tool awscurl-polling-docker action
author: Digitaal Vlaanderen
inputs:

  environment:
    description: 'options ["test", "beta", "tni", "stg", "prd", "acc"]'
    required: true
    default: stg

  version:
    description: 'build version'
    required: true

  status-url:
    description: status url
    required: true

  deploy-url: 
    description: deploy url
    required: true

  role-arn:
    description: aws role arn to assume
    required: true

  region:
    description: 'region | default: eu-west-1'
    required: false
    default: eu-west-1

  interval:
    description: polling interval in seconds default is 2 seconds
    required: false
    default: 2

  deploy-target:
    description: 'options ["none", "beanstalk", "ecs", "ecs_service", "agb_ecs_service", "ecs_scheduled_task"] | default: none '
    required: false
    default: none

  domain:
    description: 'options ["none", "basisregisters"] | default: none'
    required: false
    default: none

  project:
    description: 'options ["none", "basisregisters"] | default: none'
    required: false
    default: none

  application:
    description: 'options ["none", "basisregisters"] | default: none'
    required: true
    default: none

  use-subfolder:
    description: 'options [true, false] | default: false'
    required: false
    default: false

outputs:
  build-uuid:
    description: the build-uuid

  status:
    description: the final status

  final-message:
    description: the final message

runs:
  using: 'docker'
  image: 'docker://ghcr.io/informatievlaanderen/awscurl-polling-action:deploy-v4.1.0'
  args:
    - ${{ inputs.environment }}
    - ${{ inputs.version }}
    - ${{ inputs.status-url }}
    - ${{ inputs.deploy-url }}
    - ${{ inputs.role-arn }}
    - ${{ inputs.interval }}
    - ${{ inputs.region }}
    - ${{ inputs.deploy-target }}
    - ${{ inputs.domain }}
    - ${{ inputs.project }}
    - ${{ inputs.application }}
    - ${{ inputs.use-subfolder }}
branding:
  icon: 'terminal'
  color: 'yellow'
